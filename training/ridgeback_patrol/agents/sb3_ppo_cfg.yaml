# PPO hyperparameters for Ridgeback Patrol indoor navigation
# Framework: Stable-Baselines3
seed: 42

n_timesteps: !!float 5e6
policy: 'MlpPolicy'
batch_size: 256
n_steps: 512
gamma: 0.99
gae_lambda: 0.95
n_epochs: 10
ent_coef: 0.01
max_grad_norm: 0.5
vf_coef: 0.5
learning_rate: !!float 3e-4
use_sde: False
clip_range: 0.2
target_kl: 0.02  # early-stop policy update if KL diverges (prevents NaN)
device: "cuda:0"
# Observation/value normalization (prevents gradient explosion)
normalize_input: True
normalize_value: True
clip_obs: 10.0
policy_kwargs:
  activation_fn: 'nn.ReLU'
  net_arch:
    pi: [128, 128]
    vf: [128, 128]
