# ============================================================================
# Revit to USD Conversion Pipeline - Configuration
# Author: Steven Thomas
# MSOE Robotics Research - Isaac Sim Navigation Training
# ============================================================================

# Element Filtering
filtering:
  exclude_types:
    # MEP Systems
    - IfcDistributionPort
    - IfcFlowTerminal
    - IfcFlowFitting
    - IfcFlowSegment
    - IfcDuctSegment
    - IfcDuctFitting
    - IfcPipeSegment
    - IfcPipeFitting
    - IfcCableSegment
    - IfcCableCarrierSegment
    - IfcMechanicalEquipment
    - IfcDistributionControlElement
    - IfcAnnotation
    - IfcGrid
    - IfcOpeningElement
    # Furniture
    - IfcFurniture
    - IfcFurnishingElement
    - IfcSystemFurnitureElement
  
  include_types: []

# USD Output Settings
output:
  default_prim_name: "Building"
  add_metadata: false
  optimize_mesh: false
  create_materials: true
  
  # Coordinate system correction
  # Rotation is disabled - up-axis is now declared via stage metadata (UsdGeom.SetStageUpAxis Z)
  # which is the correct fix for IFC->Isaac Sim orientation. Enable only if still needed.
  apply_rotation: false
  rotation_axis: "x"
  rotation_degrees: 180

# Processing Options
processing:
  geometry_settings:
    use_world_coords: true
  
  verbose_logging: true
  skip_on_error: true

# File Paths
paths:
  input_folder: "input_ifc"
  output_folder: "output_usd"
  log_folder: "logs"