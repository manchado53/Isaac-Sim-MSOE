  doResize();
};

function setMode(isTSP) {
  tspMode = isTSP;
  document.getElementById("btn-dijkstra").className = isTSP ? "toggle-btn" : "toggle-btn active-dijkstra";
  document.getElementById("btn-tsp").className = isTSP ? "toggle-btn active-tsp" : "toggle-btn";
  modeHintEl.textContent = isTSP ? "Click START node (visits all nodes)" : "Click START then END";
  clearSelection();
}

function doResize() {
  var maxW = window.innerWidth - 30;
  SCALE = maxW / DISP_W;
  cv.width = Math.floor(DISP_W * SCALE);
  cv.height = Math.floor(DISP_H * SCALE);
  draw();
}

function sx(x) { return x * SCALE; }
function sy(y) { return y * SCALE; }

var ADJ = {};
for (var i = 0; i < NODES.length; i++) ADJ[i] = [];
for (var i = 0; i < EDGES.length; i++) {
  var e = EDGES[i];
  var dx = NODES[e.a].x - NODES[e.b].x, dy = NODES[e.a].y - NODES[e.b].y;
  var d = Math.sqrt(dx*dx + dy*dy);
  ADJ[e.a].push({to: e.b, w: d});
  ADJ[e.b].push({to: e.a, w: d});
}

function dijkstra(src) {
  var n = NODES.length;
  var dist = [], prev = [];
  for (var i = 0; i < n; i++) { dist.push(Infinity); prev.push(-1); }
  var visited = {};
  dist[src] = 0;
  var pq = [[0, src]];
  while (pq.length > 0) {
    var minIdx = 0;
    for (var i = 1; i < pq.length; i++) { if (pq[i][0] < pq[minIdx][0]) minIdx = i; }
    var item = pq.splice(minIdx, 1)[0];
    var dd = item[0], u = item[1];
    if (visited[u]) continue;
    visited[u] = true;
    for (var j = 0; j < ADJ[u].length; j++) {
      var v = ADJ[u][j].to, w = ADJ[u][j].w;
      if (!visited[v] && dist[u] + w < dist[v]) {
        dist[v] = dist[u] + w;
        prev[v] = u;
        pq.push([dist[v], v]);
      }
    }
  }
  return {dist: dist, prev: prev};
}

function getPath(prev, target) {
  var path = [];
  var cur = target;
  while (cur !== -1) { path.push(cur); cur = prev[cur]; }
  path.reverse();
  return path;
}

function runDijkstraMode() {
  var res = dijkstra(startNode);
  if (res.dist[endNode] === Infinity) {
    statusEl.textContent = "No path found!";
    pathInfoEl.textContent = "";
    return;
  }
  resultPath = getPath(res.prev, endNode);
  resultDist = res.dist[endNode];
  tspVisitOrder = []; tspVisitNum = {};
  statusEl.textContent = "Dijkstra: node_" + (startNode+1) + " -> node_" + (endNode+1);
  pathInfoEl.textContent = resultPath.length + " nodes | " + resultDist.toFixed(1) + "px";
  draw();
}

function runTSPMode() {
  statusEl.textContent = "Computing TSP...";
  setTimeout(function() { doTSP(); }, 10);
}

function doTSP() {
  var allDist = {}, allPrev = {};
  var reachable = [];
  var testRes = dijkstra(startNode);
  for (var i = 0; i < NODES.length; i++) {
    if (testRes.dist[i] < Infinity) reachable.push(i);
  }
  for (var k = 0; k < reachable.length; k++) {
    var r = dijkstra(reachable[k]);
    allDist[reachable[k]] = r.dist;
    allPrev[reachable[k]] = r.prev;
  }

  var unvisited = {};
  for (var k = 0; k < reachable.length; k++) unvisited[reachable[k]] = true;
  delete unvisited[startNode];

  tspVisitOrder = [startNode];
  var fullPath = [startNode];
  var totalDist = 0;
  var current = startNode;

  while (Object.keys(unvisited).length > 0) {
    var remaining = Object.keys(unvisited).map(Number);
    var bestDist = Infinity, bestNode = -1;
    for (var k = 0; k < remaining.length; k++) {
      var candidate = remaining[k];
      if (allDist[current][candidate] < bestDist) {
        bestDist = allDist[current][candidate];
        bestNode = candidate;
      }
    }
    if (bestNode === -1) break;
    var seg = getPath(allPrev[current], bestNode);
    for (var s = 1; s < seg.length; s++) fullPath.push(seg[s]);
    totalDist += allDist[current][bestNode];
    tspVisitOrder.push(bestNode);
    delete unvisited[bestNode];
    current = bestNode;
  }

  resultPath = fullPath;
  resultDist = totalDist;
  tspVisitNum = {};
  for (var i = 0; i < tspVisitOrder.length; i++) tspVisitNum[tspVisitOrder[i]] = i + 1;

  statusEl.textContent = "TSP: " + tspVisitOrder.length + "/" + reachable.length + " nodes | " + totalDist.toFixed(0) + "px total";
  pathInfoEl.textContent = "Start: node_" + (startNode+1) + " | " + fullPath.length + " waypoints";
  startAnim();
}

function startAnim() {
  stopAnim();
  animStep = 0; animTotal = resultPath.length;
  animRunning = true; animPaused = false;
  animControls.style.display = "flex";
  document.getElementById("anim-btn-text").textContent = "Pause";
  animTick();
}
function animTick() {
  if (!animRunning || animPaused) return;
  if (animStep < animTotal) { animStep++; draw(); animTimer = setTimeout(animTick, animSpeed); }
  else { animRunning = false; document.getElementById("anim-btn-text").textContent = "Done"; }
}
function stopAnim() { animRunning = false; animPaused = false; if (animTimer) { clearTimeout(animTimer); animTimer = null; } }
function toggleAnim() {
  if (!animRunning && animStep >= animTotal) { resetAnim(); return; }
  if (animPaused) { animPaused = false; document.getElementById("anim-btn-text").textContent = "Pause"; animTick(); }
  else { animPaused = true; document.getElementById("anim-btn-text").textContent = "Play"; }
}
function resetAnim() { stopAnim(); animStep = 0; animRunning = true; animPaused = false; document.getElementById("anim-btn-text").textContent = "Pause"; animTick(); }
function skipAnim() { stopAnim(); animStep = animTotal; document.getElementById("anim-btn-text").textContent = "Done"; draw(); }
function changeSpeed(dir) { if (dir > 0) animSpeed = Math.max(5, animSpeed - 15); else animSpeed = Math.min(200, animSpeed + 15); }

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (imgLoaded) ctx.drawImage(bgImg, 0, 0, cv.width, cv.height);

  var isTSP = tspMode && tspVisitOrder.length > 0;
  var pathColor = isTSP ? "#ff8800" : "#ffff00";
  var drawLen = (isTSP && animStep < animTotal) ? animStep : resultPath.length;

  ctx.strokeStyle = "rgba(0,160,0,0.5)";
  ctx.lineWidth = Math.max(1, 2 * SCALE);
  for (var i = 0; i < EDGES.length; i++) {
    var ed = EDGES[i];
    ctx.beginPath();
    ctx.moveTo(sx(NODES[ed.a].x), sy(NODES[ed.a].y));
    ctx.lineTo(sx(NODES[ed.b].x), sy(NODES[ed.b].y));
    ctx.stroke();
  }

  if (drawLen > 1) {
    ctx.strokeStyle = pathColor;
    ctx.lineWidth = Math.max(3, 4 * SCALE);
    ctx.beginPath();
    ctx.moveTo(sx(NODES[resultPath[0]].x), sy(NODES[resultPath[0]].y));
    for (var i = 1; i < drawLen; i++) ctx.lineTo(sx(NODES[resultPath[i]].x), sy(NODES[resultPath[i]].y));
    ctx.stroke();
  }

  var visiblePathNodes = {};
  for (var i = 0; i < drawLen; i++) visiblePathNodes[resultPath[i]] = true;

  for (var i = 0; i < NODES.length; i++) {
    var n = NODES[i];
    var r = Math.max(5, 7 * SCALE), color = "#0064ff";
    if (i === startNode) { r = Math.max(8, 10 * SCALE); color = "#00dd00"; }
    else if (i === endNode && drawLen >= resultPath.length) { r = Math.max(8, 10 * SCALE); color = "#ff2222"; }
    else if (visiblePathNodes[i]) { r = Math.max(6, 8 * SCALE); color = pathColor; }
    ctx.beginPath();
    ctx.arc(sx(n.x), sy(n.y), r, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.fill();
    ctx.strokeStyle = "#000"; ctx.lineWidth = 1; ctx.stroke();

    var label;
    if (isTSP && tspVisitNum[i] !== undefined && visiblePathNodes[i]) label = "#" + tspVisitNum[i];
    else label = String(i + 1);
    ctx.fillStyle = "#fff"; ctx.strokeStyle = "#000"; ctx.lineWidth = 2;
    ctx.font = (isTSP && tspVisitNum[i] !== undefined && visiblePathNodes[i])
      ? "bold " + Math.max(9, 11 * SCALE) + "px Arial"
      : Math.max(8, 10 * SCALE) + "px Arial";
    ctx.strokeText(label, sx(n.x) + r + 2, sy(n.y) + 4);
    ctx.fillText(label, sx(n.x) + r + 2, sy(n.y) + 4);
  }

  if (startNode !== null) {
    var n = NODES[startNode];
    ctx.font = "bold " + Math.max(10, 14 * SCALE) + "px Arial";
    ctx.fillStyle = "#00ff00"; ctx.strokeStyle = "#000"; ctx.lineWidth = 3;
    var txt = isTSP ? "START (#1)" : "START";
    var tw = ctx.measureText(txt).width;
    var lx = sx(n.x) + 10 * SCALE, ly = sy(n.y) - 10 * SCALE;
    if (lx + tw > cv.width) lx = sx(n.x) - 10 * SCALE - tw;
    if (ly < 20) ly = sy(n.y) + 20 * SCALE;
    ctx.strokeText(txt, lx, ly); ctx.fillText(txt, lx, ly);
  }
  if (endNode !== null && drawLen >= resultPath.length) {
    var n = NODES[endNode];
    ctx.font = "bold " + Math.max(10, 14 * SCALE) + "px Arial";
    ctx.fillStyle = "#ff4444"; ctx.strokeStyle = "#000"; ctx.lineWidth = 3;
    var lbl = isTSP ? "END (#" + tspVisitOrder.length + ")" : "END";
    var tw = ctx.measureText(lbl).width;
    var lx = sx(n.x) + 10 * SCALE, ly = sy(n.y) - 10 * SCALE;
    if (lx + tw > cv.width) lx = sx(n.x) - 10 * SCALE - tw;
    if (ly < 20) ly = sy(n.y) + 20 * SCALE;
    ctx.strokeText(lbl, lx, ly); ctx.fillText(lbl, lx, ly);
  }
}

function findNearest(mx, my) {
  var best = -1, bestD = Math.max(30, 20 * SCALE);
  for (var i = 0; i < NODES.length; i++) {
    var dx = mx - sx(NODES[i].x), dy = my - sy(NODES[i].y);
    var d = Math.sqrt(dx*dx + dy*dy);
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}

function onClick(evt) {
  var rect = cv.getBoundingClientRect();
  // Convert CSS pixels to canvas pixels (handles high-DPI and CSS scaling)
  var scaleX = cv.width / rect.width;
  var scaleY = cv.height / rect.height;
  var mx = (evt.clientX - rect.left) * scaleX;
  var my = (evt.clientY - rect.top) * scaleY;
  var idx = findNearest(mx, my);
  console.log("Click: css=(" + (evt.clientX - rect.left).toFixed(0) + "," + (evt.clientY - rect.top).toFixed(0) + ") canvas=(" + mx.toFixed(0) + "," + my.toFixed(0) + ") scale=" + scaleX.toFixed(2) + " matched=" + idx);
  if (idx >= 0) {
    console.log("  -> node_" + (idx+1) + " at canvas (" + sx(NODES[idx].x).toFixed(0) + "," + sy(NODES[idx].y).toFixed(0) + ")");
  }
  if (idx < 0) return;

  if (tspMode) {
    // TSP: only need a start node, then visit all nodes
    startNode = idx; endNode = null;
    resultPath = []; tspVisitOrder = []; tspVisitNum = {};
    pathInfoEl.textContent = "";
    draw();
    setTimeout(function() { runTSPMode(); }, 10);
  } else if (startNode === null) {
    startNode = idx;
    resultPath = []; tspVisitOrder = []; tspVisitNum = {};
    pathInfoEl.textContent = "";
    statusEl.textContent = "START: node_" + (idx+1) + " -- now select END node";
    stopAnim(); animControls.style.display = "none";
    draw();
  } else if (endNode === null) {
    if (idx === startNode) return;
    endNode = idx;
    runDijkstraMode();
  } else {
    startNode = idx; endNode = null;
    resultPath = []; tspVisitOrder = []; tspVisitNum = {};
    pathInfoEl.textContent = "";
    statusEl.textContent = "START: node_" + (idx+1) + " -- now select END node";
    stopAnim(); animControls.style.display = "none";
    draw();
  }
}

function clearSelection() {
  startNode = null; endNode = null;
  resultPath = []; resultDist = 0;
  tspVisitOrder = []; tspVisitNum = {};
  stopAnim(); animControls.style.display = "none";
  statusEl.textContent = "Select a START node";
  pathInfoEl.textContent = "";
  draw();
}

function findFarthest() {
  var best = 0, si = 0, ei = 0;
  for (var i = 0; i < NODES.length; i++) {
    for (var j = i+1; j < NODES.length; j++) {
      var dx = NODES[i].x - NODES[j].x, dy = NODES[i].y - NODES[j].y;
      var d = Math.sqrt(dx*dx + dy*dy);
      if (d > best) { best = d; si = i; ei = j; }
    }
  }
  startNode = si; endNode = ei;
  if (tspMode) {
    // TSP only needs start, pick the first of the farthest pair
    endNode = null;
    draw();
    setTimeout(function() { runTSPMode(); }, 10);
  } else {
    runDijkstraMode();
  }
}

function onKey(evt) {
  if (evt.target.tagName === "INPUT") return;
  var k = evt.key.toLowerCase();
  if (k === "c") clearSelection();
  if (k === "f") findFarthest();
  if (k === "d") setMode(false);
  if (k === "t") setMode(true);
  if (k === " ") { evt.preventDefault(); toggleAnim(); }
}
</script>
</body>
