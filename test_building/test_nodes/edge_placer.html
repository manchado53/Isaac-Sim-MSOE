  SCALE = maxW / DISP_W;
  cv.width = Math.floor(DISP_W * SCALE);
  cv.height = Math.floor(DISP_H * SCALE);
  draw();
}

function sx(x) { return x * SCALE; }
function sy(y) { return y * SCALE; }

function setMode(m) {
  mode = m;
  selectedNode = null;
  movingNode = null;
  document.getElementById("btn-edge").className = (m === "edge") ? "active" : "";
  document.getElementById("btn-addnode").className = (m === "addnode") ? "active" : "";
  document.getElementById("btn-movenode").className = (m === "movenode") ? "active" : "";
  document.getElementById("btn-delnode").className = (m === "delnode") ? "danger active" : "danger";
  var msgs = {
    "edge": "Edge mode -- click two nodes to connect",
    "addnode": "Add Node -- click on map to place",
    "movenode": "Move Node -- click node, then new position",
    "delnode": "Delete Node -- click a node to remove"
  };
  statusEl.textContent = msgs[m];
  draw();
}

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (imgLoaded) {
    ctx.drawImage(bgImg, 0, 0, cv.width, cv.height);
  } else {
    ctx.fillStyle = "#333";
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = "#fff";
    ctx.font = "20px Arial";
    ctx.fillText("Loading image...", 50, 50);
  }

  ctx.strokeStyle = "rgba(255,100,0,0.7)";
  ctx.lineWidth = Math.max(1, 2 * SCALE);
  for (var i = 0; i < edges.length; i++) {
    var e = edges[i];
    if (e.a >= nodes.length || e.b >= nodes.length) continue;
    ctx.beginPath();
    ctx.moveTo(sx(nodes[e.a].x), sy(nodes[e.a].y));
    ctx.lineTo(sx(nodes[e.b].x), sy(nodes[e.b].y));
    ctx.stroke();
  }

  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    var r = Math.max(3, 5 * SCALE);
    var color = "#00cc00";
    if (i === selectedNode) { r = Math.max(5, 7 * SCALE); color = "#ffff00"; }
    ctx.beginPath();
    ctx.arc(sx(n.x), sy(n.y), r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 1.5;
    ctx.font = Math.max(7, 9 * SCALE) + "px Arial";
    ctx.strokeText(String(i + 1), sx(n.x) + r + 1, sy(n.y) + 3);
    ctx.fillText(String(i + 1), sx(n.x) + r + 1, sy(n.y) + 3);
  }
}

function findNearest(mx, my) {
  var best = -1, bestD = Math.max(12, 15 * SCALE);
  for (var i = 0; i < nodes.length; i++) {
    var dx = mx - sx(nodes[i].x), dy = my - sy(nodes[i].y);
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}

function getClickPos(e) {
  var rect = cv.getBoundingClientRect();
  return { mx: e.clientX - rect.left, my: e.clientY - rect.top };
}

function onClick(e) {
  var pos = getClickPos(e);
  var mx = pos.mx, my = pos.my;

  if (mode === "addnode") {
    var nx = Math.round(mx / SCALE);
    var ny = Math.round(my / SCALE);
    var newNode = {id: "node_" + nextNodeId, x: nx, y: ny};
    undoStack.push({action: "addnode"});
    nodes.push(newNode);
    nextNodeId++;
    statusEl.textContent = "Added node_" + nodes.length + " at (" + nx + ", " + ny + ") -> grid (" + Math.round(nx * SAVE_SCALE_X) + ", " + Math.round(ny * SAVE_SCALE_Y) + ")";
    draw();
    return;
  }

  if (mode === "delnode") {
    var idx = findNearest(mx, my);
    if (idx < 0) return;
    var removedEdges = [];
    for (var i = edges.length - 1; i >= 0; i--) {
      if (edges[i].a === idx || edges[i].b === idx) {
        removedEdges.push({index: i, edge: {a: edges[i].a, b: edges[i].b}});
        edges.splice(i, 1);
      }
    }
    for (var i = 0; i < edges.length; i++) {
      if (edges[i].a > idx) edges[i].a--;
      if (edges[i].b > idx) edges[i].b--;
    }
    var removedNode = nodes.splice(idx, 1)[0];
    undoStack.push({action: "delnode", index: idx, node: removedNode, edges: removedEdges});
    statusEl.textContent = "Deleted " + removedNode.id;
    selectedNode = null;
    draw();
    return;
  }

  if (mode === "movenode") {
    if (movingNode === null) {
      var idx = findNearest(mx, my);
      if (idx < 0) return;
      movingNode = idx;
      selectedNode = idx;
      statusEl.textContent = "Moving node_" + (idx + 1) + " -- click new position";
      draw();
    } else {
      var nx = Math.round(mx / SCALE);
      var ny = Math.round(my / SCALE);
      undoStack.push({action: "movenode", index: movingNode, oldX: nodes[movingNode].x, oldY: nodes[movingNode].y});
      nodes[movingNode].x = nx;
      nodes[movingNode].y = ny;
      statusEl.textContent = "Moved node_" + (movingNode + 1) + " -> grid (" + Math.round(nx * SAVE_SCALE_X) + ", " + Math.round(ny * SAVE_SCALE_Y) + ")";
      movingNode = null;
      selectedNode = null;
      draw();
    }
    return;
  }

  var idx = findNearest(mx, my);
  if (idx < 0) return;
  if (selectedNode === null) {
    selectedNode = idx;
    statusEl.textContent = "Selected node_" + (idx + 1) + " -- click second node";
    draw();
  } else {
    if (idx === selectedNode) { selectedNode = null; draw(); return; }
    for (var i = 0; i < edges.length; i++) {
      if ((edges[i].a === selectedNode && edges[i].b === idx) || (edges[i].a === idx && edges[i].b === selectedNode)) {
        statusEl.textContent = "Edge already exists!";
        selectedNode = null; draw(); return;
      }
    }
    undoStack.push({action: "addedge"});
    edges.push({a: selectedNode, b: idx});
    statusEl.textContent = "Edge: node_" + (selectedNode + 1) + " -- node_" + (idx + 1);
    selectedNode = null;
    draw();
  }
}

function onMouseMove(e) {
  var pos = getClickPos(e);
  var px = Math.round(pos.mx / SCALE), py = Math.round(pos.my / SCALE);
  var gx = Math.round(px * SAVE_SCALE_X), gy = Math.round(py * SAVE_SCALE_Y);
  var nearest = findNearest(pos.mx, pos.my);
  var txt = "Display: (" + px + "," + py + ") Grid: (" + gx + "," + gy + ")";
  if (nearest >= 0) txt += " | node_" + (nearest + 1);
  infoEl.textContent = txt;
}

function doUndo() {
  if (undoStack.length === 0) return;
  var h = undoStack.pop();
  if (h.action === "addedge") { edges.pop(); }
  else if (h.action === "addnode") { nodes.pop(); }
  else if (h.action === "delnode") {
    nodes.splice(h.index, 0, h.node);
    for (var i = 0; i < edges.length; i++) {
      if (edges[i].a >= h.index) edges[i].a++;
      if (edges[i].b >= h.index) edges[i].b++;
    }
    for (var i = h.edges.length - 1; i >= 0; i--) edges.splice(h.edges[i].index, 0, h.edges[i].edge);
  }
  else if (h.action === "movenode") { nodes[h.index].x = h.oldX; nodes[h.index].y = h.oldY; }
  statusEl.textContent = "Undone";
  selectedNode = null; movingNode = null;
  draw();
}

function saveJSON() {
  var out = { floor: "floor_4", grid_size: [FULL_W, FULL_H], display_size: [DISP_W, DISP_H], nodes: [], edges: [], total_nodes: nodes.length, total_edges: edges.length };
  for (var i = 0; i < nodes.length; i++) {
    out.nodes.push({id: "node_" + (i + 1), grid_col: Math.round(nodes[i].x * SAVE_SCALE_X), grid_row: Math.round(nodes[i].y * SAVE_SCALE_Y)});
  }
  for (var i = 0; i < edges.length; i++) {
    var a = edges[i].a, b = edges[i].b;
    var gax = nodes[a].x * SAVE_SCALE_X, gay = nodes[a].y * SAVE_SCALE_Y;
    var gbx = nodes[b].x * SAVE_SCALE_X, gby = nodes[b].y * SAVE_SCALE_Y;
    var dist = Math.sqrt((gax-gbx)*(gax-gbx) + (gay-gby)*(gay-gby));
    out.edges.push({from: "node_" + (a + 1), to: "node_" + (b + 1), distance: Math.round(dist * 100) / 100});
  }
  var blob = new Blob([JSON.stringify(out, null, 2)], {type: "application/json"});
  var link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "floor_4_fullres_graph.json";
  link.click();
  statusEl.textContent = "Saved (" + nodes.length + " nodes, " + edges.length + " edges) - coords in " + FULL_W + "x" + FULL_H + " grid space";
}

function loadJSON() {
  var input = document.createElement("input");
  input.type = "file"; input.accept = ".json";
  input.onchange = function(ev) {
    var reader = new FileReader();
    reader.onload = function(re) {
      var data = JSON.parse(re.target.result);
      if (data.nodes && data.edges) {
        nodes = []; edges = [];
        for (var i = 0; i < data.nodes.length; i++) {
          var n = data.nodes[i];
          nodes.push({id: n.id, x: Math.round(n.grid_col / SAVE_SCALE_X), y: Math.round(n.grid_row / SAVE_SCALE_Y)});
        }
        for (var i = 0; i < data.edges.length; i++) {
          var ed = data.edges[i];
          edges.push({a: parseInt(ed.from.replace("node_","")) - 1, b: parseInt(ed.to.replace("node_","")) - 1});
        }
        nextNodeId = nodes.length + 1; undoStack = [];
        statusEl.textContent = "Loaded " + nodes.length + " nodes, " + edges.length + " edges";
        draw();
      }
    };
    reader.readAsText(ev.target.files[0]);
  };
  input.click();
}

function clearAll() {
  if (!confirm("Clear all nodes and edges?")) return;
  undoStack = []; nodes = []; edges = []; nextNodeId = 1;
  selectedNode = null; movingNode = null;
  statusEl.textContent = "Cleared"; draw();
}

function onKey(e) {
  if (e.target.tagName === "INPUT") return;
  var k = e.key.toLowerCase();
  if (k === "e") setMode("edge");
  if (k === "a") setMode("addnode");
  if (k === "m") setMode("movenode");
  if (k === "x") setMode("delnode");
  if (k === "z") doUndo();
  if (k === "s") { e.preventDefault(); saveJSON(); }
  if (k === "l") loadJSON();
}
</script>
</body>
</html>
